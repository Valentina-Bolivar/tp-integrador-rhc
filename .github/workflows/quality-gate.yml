# Puerta de calidad determinística: se ejecuta en cada pull request y en cada push a main.
# Si falla un test o el linter, el PR queda marcado con una cruz roja y QA lo [BLOQUEA].
name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Linter (PEP8 con ruff)
        run: ruff check src tests app
      - name: Tests automáticos (pytest)
        run: pytest -q
