[project]
name = "rhc"
version = "0.1.0"
description = "TP Integrador EAyMR 2026: efecto causal del cateterismo cardíaco derecho sobre la mortalidad"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
